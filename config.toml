baseURL = "https://abtest.chat/"
title = "展博增长实验室 | 出海游戏增长、AB实验与买量咨询"
languageCode = "zh-CN"
defaultContentLanguage = "zh"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true

# 分页
paginate = 10
paginatePath = "page"

# 分类系统 - 支持全站标签筛选
[taxonomies]
  tag = "tags"
  category = "categories"

# 让所有section都支持taxonomy
[params.taxonomies]
  includeSections = ["posts", "work", "services"]

# 永久链接
[permalinks]
  posts = "/posts/:title/"

# 启用 Goldmark 渲染钩子（处理图片/链接路径）
[markup.goldmark.renderHooks.image]
enableDefault = true

[markup.goldmark.renderHooks.link]
enableDefault = true

# 允许 Markdown 中的原始 HTML（表格里的 <br>、可选样式等）
[markup.goldmark.renderer]
unsafe = true

# Netlify 部署在根域名，使用绝对 URL 避免内页导航生成相对路径
relativeURLs = false
canonifyURLs = false

# 菜单
[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 10

  [[menu.main]]
    name = "服务"
    url = "/services/"
    weight = 20

  [[menu.main]]
    name = "案例"
    url = "/work/"
    weight = 30

  [[menu.main]]
    name = "诊断"
    url = "/diagnostic/"
    weight = 35

  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 40

  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 50

# 站点参数
[params]
  author = "何赞"
  description = "展博增长实验室专注出海游戏增长咨询，提供UA买量诊断、AB实验体系、商业化增长、发行投放平台和AI Agent增长系统建设服务。"
  keywords = ["出海游戏增长", "UA买量", "AB测试", "A/B实验", "增长咨询", "买量诊断", "商业化增长", "投放平台", "AI Agent", "AppsFlyer", "ROAS", "LTV"]
  images = ["/images/og-default.svg"]

  # PaperMod 主题配置
  env = "production"
  title = "展博增长实验室"
  mainSections = ["posts"]
  defaultTheme = "auto"
  disableThemeToggle = false
  disableAnchoredHeadings = false
  showReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true

[params.schema]
  publisherType = "Person"
  sameAs = ["https://github.com/datazhanbo"]

[params.analytics.google]
  id = "G-H31QEMFKYD"

# 首页配置
[homeInfoParams]
  Title = "展博增长实验室"
  Content = "面向出海游戏 Studio 和增长团队，提供 UA 买量诊断、A/B 实验体系、商业化增长、发行投放平台和 AI Agent 增长系统咨询。"

# 社交链接
socialIcons = [
  { name = "github", url = "https://github.com/datazhanbo" },
  { name = "rss", url = "index.xml" }
]

# Giscus 评论系统配置
[params.giscus]
  enable = false
  repo = ""
  repoId = ""
  category = "Announcements"
  categoryId = ""
  mapping = "pathname"
  strict = "0"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "bottom"
  theme = "light"
  lang = "zh-CN"
  loading = "lazy"

# 输出格式配置
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 作者配置
[author]
  name = "zhanbo"
  email = ""
  github = "datazhanbo"
