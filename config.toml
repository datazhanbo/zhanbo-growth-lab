baseURL = "https://abtest.chat/"
title = "展博增长实验室 | 实验体系、营销数据、投放智能化与企业级 Agent"
languageCode = "zh-CN"
defaultContentLanguage = "zh"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true

# 分页
paginate = 10
paginatePath = "page"

# 分类系统 - 支持全站标签筛选
[taxonomies]
  tag = "tags"
  category = "categories"

# 让所有section都支持taxonomy
[params.taxonomies]
  includeSections = ["posts", "work", "services", "tools"]

# 永久链接
[permalinks]
  posts = "/posts/:title/"

# 启用 Goldmark 渲染钩子（处理图片/链接路径）
[markup.goldmark.renderHooks.image]
enableDefault = true

[markup.goldmark.renderHooks.link]
enableDefault = true

# 允许 Markdown 中的原始 HTML（表格里的 <br>、可选样式等）
[markup.goldmark.renderer]
unsafe = true

# Netlify 部署在根域名，使用绝对 URL 避免内页导航生成相对路径
relativeURLs = false
canonifyURLs = false

# 菜单
[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 10

  [[menu.main]]
    name = "工具"
    url = "/tools/"
    weight = 20

  [[menu.main]]
    name = "服务"
    url = "/services/"
    weight = 30

  [[menu.main]]
    name = "案例"
    url = "/work/"
    weight = 40

  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 50

  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 60

# 站点参数
[params]
  author = "展博"
  description = "展博（何赞），独立增长咨询顾问。面向应用、电商、SaaS 与平台型业务，提供AB实验体系搭建、营销数据平台建设、Agentic投放智能化与企业级Agent共建咨询。从数据诊断到平台交付，让增长决策可复现、可审计、可规模化。"
  keywords = ["增长咨询顾问", "独立增长咨询顾问", "AB实验咨询", "实验体系搭建", "营销数据平台", "投放智能化", "Agentic投放", "企业级Agent", "增长数据诊断", "Data & AI 咨询", "Agentic Ad", "展博增长实验室"]
  images = ["/images/og-default.svg"]

  # PaperMod 主题配置
  env = "production"
  title = "展博增长实验室"
  mainSections = ["posts"]
  defaultTheme = "auto"
  disableThemeToggle = false
  disableAnchoredHeadings = false
  showReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true

[params.schema]
  publisherType = "Person"
  sameAs = ["https://github.com/datazhanbo", "https://abtest.chat", "https://abtest.chat/about/"]

[params.analytics.google]
  id = "G-H31QEMFKYD"

# 百度统计（国内流量必备）：去 https://tongji.baidu.com 注册后填入 hm.js 后的 ID
[params.analytics.baidu]
  id = "d5c338c18aa556f0d3305ec6a4386a44"

# Microsoft Clarity（行为分析 + Bing/Copilot 信号）：去 https://clarity.microsoft.com 注册后填入项目 ID
[params.analytics.clarity]
  id = "xy22jyul9t"

# 站点所有权校验 meta tag：百度资源平台 / GSC / Bing Webmaster 通用接入位
[params.verification]
  baidu = "codeva-1SwceJddqc"   # 百度资源平台 HTML 标签验证的 code（点「HTML标签验证」后获得）
  google = ""  # Google Search Console HTML 标签验证的 content
  bing = ""    # Bing Webmaster Tools 的 msvalidate.01

[author]
  name = "展博"
  github = "datazhanbo"

# 首页配置
[homeInfoParams]
  Title = "展博增长实验室"
  Content = "面向应用、电商与平台型业务，提供实验体系建设、营销数据平台、投放智能化与企业级 Agent 共建四类咨询服务。"

# 社交链接
socialIcons = [
  { name = "github", url = "https://github.com/datazhanbo" },
  { name = "rss", url = "index.xml" }
]

# Giscus 评论系统配置
[params.giscus]
  enable = false
  repo = ""
  repoId = ""
  category = "Announcements"
  categoryId = ""
  mapping = "pathname"
  strict = "0"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "bottom"
  theme = "light"
  lang = "zh-CN"
  loading = "lazy"

# 输出格式配置
[outputs]
  home = ["HTML", "RSS", "JSON"]

