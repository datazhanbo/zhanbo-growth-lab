{{- with site.Params.images }}
{{- range first 1 . }}
<meta property="og:image" content="{{ . | absURL }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ . | absURL }}">
{{- end }}
{{- end }}
{{- if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ site.Title }},
  "alternateName": "Zhanbo Growth Lab",
  "url": {{ site.Home.Permalink }},
  "description": {{ site.Params.description }},
  "inLanguage": "zh-CN",
  "publisher": {
    "@type": "Person",
    "name": "何赞"
  }
}
</script>
{{- end }}
{{- if and (hugo.IsProduction | or (eq site.Params.env "production")) site.Params.analytics.google.id }}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.Params.analytics.google.id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.Params.analytics.google.id }}');
</script>
{{- end }}
