{{/* 增长决策可信度诊断 — 30 分钟预沟通申请表（Netlify Forms） */}}
{{/* 用法：{{< prequal_form >}}，可在任意 markdown 页嵌入；提交走 Netlify Forms，无第三方依赖 */}}
<form
  name="prequal"
  method="POST"
  data-netlify="true"
  netlify-honeypot="bot-field"
  action="/thanks/"
  class="pq-form"
>
  <input type="hidden" name="form-name" value="prequal" />
  <p class="pq-hp">
    <label>不要填写这一栏（机器人检测）<input name="bot-field" /></label>
  </p>

  <div class="pq-row">
    <label>
      <span>称呼 <em>*</em></span>
      <input type="text" name="name" required maxlength="40" placeholder="您的姓名或花名" />
    </label>
    <label>
      <span>公司 / 团队 <em>*</em></span>
      <input type="text" name="company" required maxlength="80" placeholder="公司或团队名称" />
    </label>
  </div>

  <div class="pq-row">
    <label>
      <span>角色 <em>*</em></span>
      <select name="role" required>
        <option value="">请选择</option>
        <option>CEO / 创始人</option>
        <option>业务 / 事业部负责人</option>
        <option>增长 / 市场负责人</option>
        <option>数据 / BI 负责人</option>
        <option>产品负责人</option>
        <option>其他</option>
      </select>
    </label>
    <label>
      <span>业务形态 <em>*</em></span>
      <select name="business_type" required>
        <option value="">请选择</option>
        <option>内容 / 媒体</option>
        <option>电商 / DTC</option>
        <option>SaaS / 工具</option>
        <option>消费 App / 平台</option>
        <option>其他</option>
      </select>
    </label>
  </div>

  <label>
    <span>当前最影响决策的一个问题（原话更好）<em>*</em></span>
    <textarea
      name="pain"
      required
      rows="3"
      maxlength="600"
      placeholder="例如：业务后台、归因和 BI 看到的 ROAS 对不上；准备投 Agent 但数据底座不敢用；实验做了但结论没人信……"
    ></textarea>
  </label>

  <label>
    <span>近期触发事件</span>
    <select name="trigger">
      <option value="">请选择（可留空）</option>
      <option>新市场 / 新渠道扩张</option>
      <option>预算会 / ROI 争议</option>
      <option>更换归因、BI 或数据架构</option>
      <option>融资 / 董事会前需要解释增长</option>
      <option>准备自建或采购实验平台</option>
      <option>准备落地 AI Agent</option>
      <option>其他</option>
    </select>
  </label>

  <label>
    <span>两周内可投入的对接资源 <em>*</em></span>
    <select name="bandwidth" required>
      <option value="">请选择</option>
      <option>可以，3–5 位关键角色 + 每周 4–6 小时</option>
      <option>需要协调，但能在两周内启动</option>
      <option>暂时不确定，先聊聊</option>
    </select>
  </label>

  <div class="pq-row">
    <label>
      <span>邮箱 <em>*</em></span>
      <input type="email" name="email" required maxlength="120" placeholder="用于回复和发送会前材料" />
    </label>
    <label>
      <span>微信 / 电话（可选）</span>
      <input type="text" name="wechat" maxlength="60" placeholder="方便快速对齐时填写" />
    </label>
  </div>

  <button type="submit" class="pq-submit">申请 30 分钟预沟通</button>
  <p class="pq-note">
    提交后 1 个工作日内回复。预沟通不收费、不推销；如不适合会直接告知，并可推荐更合适的伙伴。
  </p>
</form>
