<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090E">
<meta name="robots" content="noindex,nofollow">
<title>WDL · 传奇在手，天下我有</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  --bg:#07090E; --s1:#101420; --s2:#171D2B; --s3:#1F2738;
  --ln:#252E42; --tx:#E9EDF6; --dim:#8592A8; --dim2:#5C6880;
  --volt:#C8FF3D; --hot:#FF4D5E; --gold:#FFC94A; --sky:#5AC8FA;
  --r:14px;
}
html,body{background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45;overscroll-behavior-y:none}
body{padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{max-width:480px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(7,9,14,.88);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--ln)}
.top-in{max-width:480px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:7px;font-weight:800;letter-spacing:-.02em;font-size:16px}
.logo i{width:22px;height:22px;border-radius:7px;background:var(--volt);display:grid;place-items:center;
  color:#0A0D12;font-style:normal;font-size:12px;font-weight:900}
.slogan{font-size:11px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.ver{font-size:9px;font-weight:800;letter-spacing:.03em;color:var(--dim2);white-space:nowrap;
  flex:0 0 auto;margin-right:2px}
.ver.dev{color:var(--gold)}
.icon-btn{width:34px;height:34px;border-radius:10px;background:var(--s2);display:grid;place-items:center;
  font-size:14px;border:1px solid var(--ln);flex:0 0 auto}

/* ---------- generic ---------- */
.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden}
.pad{padding:14px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:20px 0 10px}
.sec-h h2{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--dim)}
.sec-h .sub{font-size:11.5px;color:var(--dim2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  height:50px;border-radius:13px;font-weight:700;font-size:15px;transition:transform .12s;text-align:center}
.btn:active{transform:scale(.975)}
.btn-p{background:var(--volt);color:#0A0D12}
.btn-g{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}
.btn-h{background:linear-gradient(135deg,#FFC94A,#FF8A3D);color:#221200}
.btn-s{height:40px;font-size:13px;border-radius:11px;width:auto;padding:0 14px;display:inline-flex}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;
  padding:2px 6px;border-radius:5px;letter-spacing:.03em;white-space:nowrap}
.tag-v{background:rgba(200,255,61,.14);color:var(--volt)}
.tag-g{background:rgba(255,201,74,.15);color:var(--gold)}
.tag-d{background:var(--s3);color:var(--dim)}
.tag-s{background:rgba(90,200,250,.14);color:var(--sky)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--dim)}
.note{font-size:10.5px;color:var(--dim2);line-height:1.65}
.note b{color:var(--dim)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:7px 0;border-bottom:1px solid var(--ln)}
.kv:last-child{border:none}
.kv .k{color:var(--dim2);flex:0 0 auto}
.kv .v{font-weight:700;text-align:right}

/* ---------- club badge ---------- */
.bd{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  font-size:10.5px;font-weight:900;letter-spacing:-.02em;flex:0 0 auto;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.bd.lg{width:46px;height:46px;border-radius:12px;font-size:13px}

/* ---------- round strip ---------- */
.strip{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.rn{flex:0 0 auto;min-width:42px;height:34px;border-radius:9px;background:var(--s1);
  border:1px solid var(--ln);font-size:12px;font-weight:700;color:var(--dim);
  display:grid;place-items:center;padding:0 9px}
.rn.on{background:var(--volt);color:#0A0D12;border-color:var(--volt)}

/* ---------- match row ---------- */
.mrow{display:flex;align-items:center;gap:10px;padding:12px 14px;
  border-bottom:1px solid var(--ln);width:100%;position:relative}
.mrow:last-child{border-bottom:none}
.mrow:active{background:var(--s2)}
.mrow.fav{background:linear-gradient(90deg,rgba(200,255,61,.07),transparent 65%)}
.mrow.fav:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--volt)}
.mrow .side{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.mrow .side.r{flex-direction:row-reverse;text-align:right}
.mrow .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .sc{font-size:19px;font-weight:800;min-width:56px;text-align:center;flex:0 0 auto;letter-spacing:.01em}
.mrow .sc .sep{color:#5E6B85;margin:0 3px;font-weight:600}
.mrow .sc .w{color:var(--volt)}
.mrow .sc .l{color:var(--dim2)}
.mrow .meta{font-size:10px;color:var(--volt);margin-top:1px;font-weight:700}

/* ---------- detail ---------- */
.score-big{display:flex;align-items:center;justify-content:center;gap:14px;padding:20px 0 8px}
.score-big .t{display:flex;flex-direction:column;align-items:center;gap:7px;width:92px}
.score-big .t .nm{font-size:11.5px;font-weight:600;text-align:center;line-height:1.25}
.score-big .v{font-size:40px;font-weight:900;letter-spacing:-.02em;line-height:1;flex:0 0 auto}
.score-big .v .sep{color:#6E7C96;margin:0 6px;font-weight:300}
.stat{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;margin:10px 0;font-size:11.5px}
.stat .b{height:5px;border-radius:3px;background:var(--s3);overflow:hidden;display:flex}
.stat .b i{display:block;height:100%}
.stat .lbl{text-align:center;color:var(--dim2);font-size:10px;letter-spacing:.04em;margin-top:3px}
.xi-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(6,auto);
  grid-auto-flow:column;gap:1px 14px;font-size:11px}
.xi-i{display:flex;align-items:center;gap:6px;padding:3px 0;color:var(--dim);min-width:0}
.xi-i b{color:var(--tx);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xi-i .o{font-size:10px;font-weight:800;color:var(--volt);min-width:17px;flex:0 0 auto}
.xi-i .ps{font-size:8.5px;color:var(--dim2);margin-left:auto;flex:0 0 auto}

/* ---------- coach card ---------- */
.coach{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:13px;
  background:linear-gradient(115deg,rgba(90,200,250,.09),rgba(90,200,250,.015));
  border:1px solid rgba(90,200,250,.26);margin-top:12px;width:100%}
.coach.lg{background:linear-gradient(115deg,rgba(255,201,74,.12),rgba(255,201,74,.02));
  border-color:rgba(255,201,74,.34)}
.coach .av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  font-size:14px;font-weight:900;flex:0 0 auto;
  background:rgba(90,200,250,.13);color:var(--sky);border:1px solid rgba(90,200,250,.3)}
.coach.lg .av{background:rgba(255,201,74,.14);color:var(--gold);border-color:rgba(255,201,74,.36)}
.coach .body{flex:1;min-width:0}
.coach .nm{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.coach .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coach .mt{font-size:10px;color:var(--dim2);margin-top:2px}
.coach .sw{font-size:11px;font-weight:800;color:var(--sky);flex:0 0 auto;padding:5px 9px;
  border-radius:8px;background:rgba(90,200,250,.1)}
.coach.lg .sw{color:var(--gold);background:rgba(255,201,74,.1)}
.coach .eff{display:flex;gap:5px;margin-top:5px}
.coach .eff i{font-style:normal;font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:4px;
  background:var(--s3);color:var(--dim)}

/* ---------- pitch ---------- */
.pitch{position:relative;width:100%;aspect-ratio:68/84;border-radius:16px;overflow:hidden;
  background:repeating-linear-gradient(0deg,#0D1911 0 8.5%,#101E15 8.5% 17%);
  border:1px solid #1B2B20;margin-top:12px}
.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.08)}
.pline{position:absolute;inset:5% 4%;border:1px solid rgba(255,255,255,.09);border-radius:2px;pointer-events:none}
.pbox{position:absolute;left:23%;right:23%;height:14%;border:1px solid rgba(255,255,255,.09);pointer-events:none}
.pbox.t{top:5%;border-top:none}
.pbox.b{bottom:5%;border-bottom:none}
.pcircle{position:absolute;left:50%;top:50%;width:25%;aspect-ratio:1;transform:translate(-50%,-50%);
  border:1px solid rgba(255,255,255,.09);border-radius:50%;pointer-events:none}
.slot{position:absolute;transform:translate(-50%,50%);display:flex;flex-direction:column;
  align-items:center;gap:3px;width:64px}
.slot .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  font-size:11.5px;font-weight:800;position:relative;
  background:radial-gradient(circle at 35% 30%,#2C3A52,#161D2B);
  border:1.5px solid #38455F;color:var(--tx);box-shadow:0 4px 12px rgba(0,0,0,.5)}
.slot .dot .ov{position:absolute;right:-6px;bottom:-5px;min-width:21px;height:16px;padding:0 3px;
  border-radius:8px;background:var(--s1);border:1px solid var(--ln);
  font-size:9px;font-weight:800;display:grid;place-items:center;color:var(--volt)}
.slot .nm{font-size:9.5px;font-weight:600;color:#C6D0E0;max-width:64px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;
  text-shadow:0 1px 3px rgba(0,0,0,.95)}
.slot.sw .dot{background:radial-gradient(circle at 35% 30%,#3A5220,#1E2C10);
  border-color:var(--volt);box-shadow:0 0 0 3px rgba(200,255,61,.13),0 4px 14px rgba(0,0,0,.5)}
.slot.lg .dot{background:radial-gradient(circle at 35% 30%,#5A4418,#2A1F08);
  border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,74,.16),0 4px 14px rgba(0,0,0,.5)}
.slot:active .dot{transform:scale(.92)}
.slot.off .dot{border-style:dashed;border-color:#4A5A78}
.slot.off .nm{color:var(--dim2)}

/* ---------- lambda meter ---------- */
.meter{padding:14px}
.meter .hd{display:flex;align-items:center;justify-content:space-between;font-size:11px;
  color:var(--dim2);margin-bottom:10px}
.bars{display:flex;flex-direction:column;gap:8px}
.mbar{display:flex;align-items:center;gap:9px;font-size:11.5px}
.mbar .who{width:54px;font-weight:600;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar .track{flex:1;height:9px;border-radius:5px;background:var(--s3);overflow:hidden}
.mbar .fill{height:100%;border-radius:5px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.mbar .val{width:34px;text-align:right;font-weight:800;font-size:12.5px;flex:0 0 auto}
.probs{display:flex;gap:1px;margin-top:12px;height:26px;border-radius:7px;overflow:hidden;font-size:10px;font-weight:700}
.probs div{display:grid;place-items:center;color:#0A0D12;transition:flex .4s}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.on{display:block}
.sheet .mask{position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;background:var(--s1);
  border-radius:20px 20px 0 0;border-top:1px solid var(--ln);
  display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--s3);margin:8px auto 4px;flex:0 0 auto}
.ph{padding:6px 18px 10px;flex:0 0 auto;border-bottom:1px solid var(--ln)}
.ph h3{font-size:16px;font-weight:800;letter-spacing:-.01em}
.ph p{font-size:11px;color:var(--dim2);margin-top:3px}
.pl{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 22px}
.prow{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--ln);width:100%}
.prow:active{background:var(--s2)}
.prow .ov{width:34px;height:34px;border-radius:9px;background:var(--s2);border:1px solid var(--ln);
  display:grid;place-items:center;font-size:13px;font-weight:800;flex:0 0 auto}
.prow .ov.hi{color:var(--volt)}
.prow .ov.gd{color:var(--gold);border-color:rgba(255,201,74,.4);background:rgba(255,201,74,.08)}
.prow .ov.sk{color:var(--sky);border-color:rgba(90,200,250,.36);background:rgba(90,200,250,.08)}
.prow .info{flex:1;min-width:0}
.prow .info .n{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.prow .info .n{white-space:nowrap}
.prow .info .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.prow .info .m{font-size:10px;color:var(--dim2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .dlt{font-size:11.5px;font-weight:800;white-space:nowrap;flex:0 0 auto}
.prow .dlt.up{color:var(--volt)}
.prow .dlt.zero{color:var(--dim2)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex}
.modal .mask{position:absolute;inset:0;background:rgba(0,0,0,.74);backdrop-filter:blur(4px)}
.modal .box{position:relative;width:100%;max-width:400px;background:var(--s1);
  border:1px solid var(--ln);border-radius:20px;padding:20px;max-height:88vh;overflow-y:auto;
  animation:pop .22s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}

#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,14px);z-index:99;
  background:rgba(28,36,52,.97);border:1px solid var(--ln);color:var(--tx);
  padding:10px 16px;border-radius:11px;font-size:12.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;backdrop-filter:blur(10px);
  max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;
  background:linear-gradient(0deg,var(--bg) 62%,rgba(7,9,14,.92) 88%,transparent);
  padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.dock-in{max-width:480px;margin:0 auto}
.dock-row{display:flex;gap:9px}
.quota{display:flex;align-items:center;justify-content:center;gap:7px;font-size:10.5px;
  color:var(--dim2);margin-bottom:9px}
.pips{display:flex;gap:4px}
.pips i{width:15px;height:4px;border-radius:2px;background:var(--s3)}
.pips i.on{background:var(--volt)}

/* ---------- result ---------- */
.big-score{text-align:center;padding:22px 0 6px}
.big-score .v{font-size:60px;font-weight:900;letter-spacing:-.04em;line-height:1}
.big-score .v .sep{color:#6E7C96;font-weight:300;margin:0 8px}
.big-score .tagline{margin-top:10px;font-size:12.5px;color:var(--dim)}
.cmp{display:flex;align-items:center;justify-content:center;gap:9px;font-size:12px;
  color:var(--dim2);margin-top:7px}
.cmp .old{text-decoration:line-through;opacity:.6}
.cmp .ar{color:var(--volt)}
/* 进球时间线 */
.tl{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:11.5px;line-height:1.4}
.tl .mn{width:29px;text-align:right;font-weight:800;font-size:10.5px;color:var(--volt);flex:0 0 auto}
.tl .bl{width:13px;height:13px;border-radius:50%;background:var(--volt);display:grid;place-items:center;
  font-size:7px;color:#0A0D12;flex:0 0 auto;line-height:1}
.tl.aw .bl{background:#4A5878}
.tl .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .tx b{font-weight:700;color:var(--tx)}
.tl .tx i{font-style:normal;font-size:9.5px;color:var(--dim2);margin-left:5px}
.tl .cd{font-size:9px;font-weight:800;color:var(--dim2);flex:0 0 auto}
.tl-none{font-size:10.5px;color:var(--dim2);padding:6px 0}

.legend-card{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;
  background:linear-gradient(120deg,rgba(255,201,74,.1),rgba(255,201,74,.02));
  border:1px solid rgba(255,201,74,.28)}
.legend-card .lk{width:34px;height:34px;border-radius:10px;background:rgba(255,201,74,.14);
  display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.abars{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:12px}
.ab{display:flex;align-items:center;gap:7px;font-size:10.5px}
.ab .k{width:28px;color:var(--dim2);font-weight:700}
.ab .t{flex:1;height:4px;border-radius:2px;background:var(--s3);overflow:hidden}
.ab .t i{display:block;height:100%;border-radius:2px}
.ab .v{width:18px;text-align:right;font-weight:800;font-size:10.5px}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="logo"><i>W</i>WDL</div>
    <div class="slogan">传奇在手，天下我有</div>
    <div class="spacer"></div>
    <span class="ver" id="verTag"></span>
    <button class="icon-btn" id="btnInfo" aria-label="模型说明">ⓘ</button>
  </div>
</header>

<main id="app"></main>
<div id="sheet" class="sheet"></div>

/* ============================================================================
   1. 引擎
   ========================================================================== */
function fnv1a32(s){
  let h = 0x811c9dc5;
  for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h >>> 0;
}
function splitmix32(a){
  return function(){
    a = (a + 0x9e3779b9) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t>>>16), 0x21f0aaad) >>> 0;
    t = Math.imul(t ^ (t>>>15), 0x735a2d97) >>> 0;
    return ((t ^ (t>>>15)) >>> 0) / 4294967296;
  };
}
function makeRng(seed){
  const sm = splitmix32(seed >>> 0);
  let a = (sm()*4294967296)>>>0, b = (sm()*4294967296)>>>0,
      c = (sm()*4294967296)>>>0, d = (sm()*4294967296)>>>0;
  return function(){
    a|=0; b|=0; c|=0; d|=0;
    let t = ((a + b) | 0) + d | 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) | 0;
    c = (c << 21) | (c >>> 11);
    d = (d + 1) | 0;
    t = (t + d) | 0;
    c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  };
}
function invPoisson(u, lam){
  let p = Math.exp(-lam), c = p;
  if (u <= c) return 0;
  for (let k=1;k<MAXG;k++){ p = p*lam/k; c += p; if (u <= c) return k; }
  return MAXG;
}
function rhoEff(lh, la){ return RHO0 * Math.min(1, 6.0 / Math.max(lh*la, 1e-6)); }
function dcTau(x,y,lh,la,r){
  if (x===0&&y===0) return 1 - lh*la*r;
  if (x===0&&y===1) return 1 + lh*r;
  if (x===1&&y===0) return 1 + la*r;
  if (x===1&&y===1) return 1 - r;
  return 1;
}
function pmf(k, lam){
  let p = Math.exp(-lam);
  for (let i=1;i<=k;i++) p = p*lam/i;
  return p;
}
function settle(seed, lh, la){
  const rng = makeRng(seed);
  const q = v => Math.round(v*1e6)/1e6;
  const u1=q(rng()), u2=q(rng()), u3=q(rng());
  let x = invPoisson(u1, lh), y = invPoisson(u2, la);
  if ((x===0&&y===0)||(x===0&&y===1)||(x===1&&y===0)||(x===1&&y===1)){
    const r = rhoEff(lh,la);
    const cells = [[0,0],[0,1],[1,0],[1,1]];
    const w = cells.map(([a,b]) => pmf(a,lh)*pmf(b,la)*dcTau(a,b,lh,la,r));
    const s = w.reduce((p,c)=>p+c,0);
    let acc = 0;
    for (let i=0;i<4;i++){ acc += w[i]/s; if (u3 <= acc){ x=cells[i][0]; y=cells[i][1]; break; } }
  }
  return {x, y, rng};
}
function outcomeProbs(lh, la){
  const ph = [], pa = [];
  for (let k=0;k<=MAXG;k++){ ph.push(pmf(k,lh)); pa.push(pmf(k,la)); }
  const r = rhoEff(lh,la);
  let w=0,d=0,l=0;
  for (let i=0;i<=MAXG;i++) for (let j=0;j<=MAXG;j++){
    const p = ph[i]*pa[j]*dcTau(i,j,lh,la,r);
    if (i>j) w+=p; else if (i===j) d+=p; else l+=p;
  }
  const s = w+d+l;
  return [w/s, d/s, l/s];
}

/* 球队强度：只用本轮之前的赛果，向联赛均值回归 */
const _st = {};
function strength(round){
  if (_st[round]) return _st[round];
  const n = CLUBS.length;
  const gf = new Array(n).fill(0), ga = new Array(n).fill(0), np = new Array(n).fill(0);
  for (const m of MATCHES){
    if (m[0] >= round) continue;
    gf[m[2]] += m[4]; ga[m[2]] += m[5]; np[m[2]]++;
    gf[m[3]] += m[5]; ga[m[3]] += m[4]; np[m[3]]++;
  }
  const k = 6, att = [], def = [];
  for (let i=0;i<n;i++){
    const d = np[i] + k;
    att[i] = Math.log(((gf[i] + k*LG_AVG) / d) / LG_AVG);
    def[i] = Math.log(((ga[i] + k*LG_AVG) / d) / LG_AVG);
  }
  return (_st[round] = {att, def, np});
}

/* 位置适配：跨位置出场的衰减。门将例外，非门将站门将位置基本报废。 */
function posFit(p, slot){
  if (slot === 0 || p.slot === 0) return (slot === 0 && p.slot === 0) ? 1 : 0.12;
  const d = Math.abs(p.slot - slot);
  return d === 0 ? 1 : (d <= 2 ? 0.74 : 0.5);
}
function effOf(p, slot){
  const f = posFit(p, slot);
  return {att: p.att * f, dfn: p.dfn * f, fit: f};
}

function lineupPower(xi){
  let a = 0, d = 0;
  for (let i=0;i<11;i++){
    const p = xi[i];
    if (!p) continue;
    const e = effOf(p, i);
    a += W_ATT[i] * e.att;
    d += W_DEF[i] * e.dfn;
  }
  return {a, d};
}
const clamp = (v,lo,hi) => Math.min(hi, Math.max(lo, v));

/* 完整 λ：球队强度 + 阵容调整 + 教练加成 */
function lambdas(mi, xiH, xiA, cH, cA){
  const m = MATCHES[mi], r = m[0], h = m[2], a = m[3];
  const s = strength(r);
  const pH = lineupPower(xiH), pA = lineupPower(xiA);
  const bH = lineupPower(DEFAULT_XI[h]), bA = lineupPower(DEFAULT_XI[a]);
  const adjH = (pH.a - bH.a) - (pA.d - bA.d);
  const adjA = (pA.a - bA.a) - (pH.d - bH.d);
  const coachH = (cH ? cH.ca : 0) - (cA ? cA.cd : 0);
  const coachA = (cA ? cA.ca : 0) - (cH ? cH.cd : 0);
  return [
    clamp(HOME_AVG * Math.exp(s.att[h] - s.def[a] + coachH + K_PLAYER*adjH), 0.15, LAM_CAP),
    clamp(AWAY_AVG * Math.exp(s.att[a] - s.def[h] + coachA + K_PLAYER*adjA), 0.15, LAM_CAP)
  ];
}
function seedFor(mi, side, lh, la, ci){
  const key = mi + "|" + side + "|" + Math.round(lh*1e4) + "|" + Math.round(la*1e4) + "|" + (ci||"");
  return splitmix32(fnv1a32(key))() * 4294967296 >>> 0;
}
function xiWith(xi, slot, p){
  const n = xi.slice();
  n[slot] = p;
  return n;
}

/* 当前局面：把「谁的阵容/教练」抽象成一对参数 */
function sidesOf(mi, st){
  const m = MATCHES[mi];
  return {
    h: m[2], a: m[3],
    xiH: st.side === 0 ? st.xi : DEFAULT_XI[m[2]],
    xiA: st.side === 1 ? st.xi : DEFAULT_XI[m[3]],
    cH: st.side === 0 ? st.coach : DEFAULT_COACH[CLUBS[m[2]].f],
    cA: st.side === 1 ? st.coach : DEFAULT_COACH[CLUBS[m[3]].f],
  };
}
function currentL(st, mi){
  const s = sidesOf(mi, st);
  return lambdas(mi, s.xiH, s.xiA, s.cH, s.cA);
}
function winOf(pr, side){ return side === 0 ? pr[0] : pr[2]; }

function judge(hg, ag, pr){
  const top = pr.indexOf(Math.max(...pr));
  const actual = hg > ag ? 0 : (hg === ag ? 1 : 2);
  const conf = Math.max(...pr);
  if (top === actual) return {t:"模型方向判对了。",
    d:`赛前给这一边的概率是 ${Math.round(conf*100)}%，结果也确实落在那里。`};
  if (actual === 1) return {t:"模型没算到这场会平。",
    d:`赛前平局只有 ${Math.round(pr[1]*100)}%。足球里最不缺的就是这种夜晚。`};
  return {t:"这场是冷门。",
    d:`赛前模型给这个结果只有 ${Math.round(pr[actual]*100)}%。这就是为什么比分值得重写一次。`};
}

function openPicker(slot){
  const mi = state.mi, m = MATCHES[mi];
  const clubIdx = state.side === 0 ? m[2] : m[3];
  const cur = state.xi[slot];
  const pool = SQUAD[clubIdx].slice();
  (LEG_BY_CLUB[CLUBS[clubIdx].f] || []).forEach(l => pool.push(l));

  const baseL = currentL(state, mi);
  const baseMy = state.side === 0 ? baseL[0] : baseL[1];
  const baseOp = state.side === 0 ? baseL[1] : baseL[0];
  const baseGd = baseMy - baseOp;
  const basePr = outcomeProbs(baseL[0], baseL[1]);
  const baseWin = winOf(basePr, state.side);

  const rows = [];
  for (const p of pool){
    if (cur && p.id === cur.id) continue;
    if (posFit(p, slot) < 0.5) continue;
    const xi2 = xiWith(state.xi, slot, p);
    const s = state.side === 0
      ? {xiH:xi2, xiA:DEFAULT_XI[m[3]], cH:state.coach, cA:DEFAULT_COACH[CLUBS[m[3]].f]}
      : {xiH:DEFAULT_XI[m[2]], xiA:xi2, cH:DEFAULT_COACH[CLUBS[m[2]].f], cA:state.coach};
    const L = lambdas(mi, s.xiH, s.xiA, s.cH, s.cA);
    const pr = outcomeProbs(L[0], L[1]);
    const myL = state.side === 0 ? L[0] : L[1];
    const opL = state.side === 0 ? L[1] : L[0];
    rows.push({p, d:(myL - opL) - baseGd, win:winOf(pr, state.side), fit: posFit(p, slot)});
  }
  rows.sort((x,y) => y.win - x.win);

  sheetEl.innerHTML = `<div class="mask" data-close></div>
    <div class="panel"><div class="grab"></div>
      <div class="ph"><h3>${SLOT_CN[slot]} · 换谁上</h3>
        <p>当前 ${esc(cur?cur.name:"空")}（${cur?cur.ovr:"-" }）· 按预期净胜球排序 · 现 λ ${baseMy.toFixed(2)}:${baseOp.toFixed(2)}</p></div>
      <div class="pl">
        ${rows.slice(0,42).map(o=>{
          const dd = o.d;
          const locked = o.p.legend && !state.unlocked;
          const off = o.fit < 1;
          return `<button class="prow" data-pick="${o.p.id}" data-pslot="${slot}">
            <div class="ov ${o.p.legend?"gd":(o.p.ovr>=78?"hi":"")}">${o.p.ovr}</div>
            <div class="info">
              <div class="n"><span>${esc(o.p.name)}</span>
                ${o.p.legend?`<span class="tag tag-g">传奇</span>`:""}${locked?`<span style="font-size:11px">🔒</span>`:""}
                ${off?`<span class="tag tag-d">${SLOTS[o.p.slot]}→${SLOTS[slot]}</span>`:""}</div>
              <div class="m">${o.p.pos} · ${o.p.min}′${o.p.st?` · 首发 ${o.p.st} 场`:""}</div>
            </div>
            <div class="dlt ${dd>0.005?"up":"zero"}">${dd>0.005?"+":""}${dd.toFixed(2)}</div>
          </button>`;
        }).join("")}
      </div></div>`;
  sheetEl.classList.add("on");
  sheetEl.querySelector("[data-close]").onclick = closeSheet;
  sheetEl.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    const id = b.dataset.pick;
    const p = P[id] || LEGENDS.find(l => l.id === id);
    if (p.legend && !state.unlocked){ closeSheet(); paywall("legend"); return; }
    doSwap(parseInt(b.dataset.pslot,10), p);
  });

function closeSheet(){ sheetEl.classList.remove("on"); sheetEl.innerHTML = ""; }

function doSwap(slot, p){
  if (usedQuota() >= state.quota){ closeSheet(); toast("额度用完了"); paywall("quota"); return; }
  const out = state.xi[slot];
  if (!out || out.id === p.id){ closeSheet(); return; }
  const before = currentL(state, state.mi);
  state.xi = xiWith(state.xi, slot, p);
  state.swaps = state.swaps.filter(s => s.slot !== slot).concat([{slot, out, in:p}]);
  const after = currentL(state, state.mi);
  closeSheet(); render();
  const same = Math.abs(after[0]-before[0]) < 1e-4 && Math.abs(after[1]-before[1]) < 1e-4;
  toast(same ? "阵容变了，但强度没变 —— 引擎认为这两人等价"
             : `${p.name} 上场 · ${SLOTS[slot]}`);
}
function doCoachSwap(c){
  if (usedQuota() >= state.quota && !state.coachSwap){ closeSheet(); toast("额度用完了"); paywall("quota"); return; }
  const out = state.coach;
  if (!out || out.id === c.id){ closeSheet(); return; }
  state.coach = c;
  state.coachSwap = {out, in:c};
  closeSheet(); render();
  toast(`换帅：${c.name}`);
}

/* ---------------------------------------------------------------- 引擎推荐
   贪心搜索：每步在「换人」和「换帅」里挑胜率增量最大的一个。
   ------------------------------------------------------------------------ */
function recommend(mi, side, xi, coach, quota, allowLegend){
  const m = MATCHES[mi];
  const clubIdx = side === 0 ? m[2] : m[3];
  const clubFull = CLUBS[clubIdx].f;

  const pool = SQUAD[clubIdx].slice();
  if (allowLegend) (LEG_BY_CLUB[clubFull] || []).forEach(l => pool.push(l));
  const cpool = coachPool(clubFull, allowLegend);

  const evalPair = (xi2, c2) => {
    const s = side === 0
      ? {xiH:xi2, xiA:DEFAULT_XI[m[3]], cH:c2, cA:DEFAULT_COACH[CLUBS[m[3]].f]}
      : {xiH:DEFAULT_XI[m[2]], xiA:xi2, cH:DEFAULT_COACH[CLUBS[m[2]].f], cA:c2};
    const L = lambdas(mi, s.xiH, s.xiA, s.cH, s.cA);
    const pr = outcomeProbs(L[0], L[1]);
    return {L, win: winOf(pr, side)};
  };

  const base = evalPair(xi, coach);
  let curXi = xi.slice(), curC = coach, curWin = base.win;
  const steps = [];
  const usedIds = new Set(curXi.filter(Boolean).map(p => p.id));
  const usedSlots = new Set();
  let coachDone = false;

  for (let k=0;k<quota;k++){
    let best = null;
    for (let s=0;s<11;s++){
      if (usedSlots.has(s)) continue;
      for (const p of pool){
        if (usedIds.has(p.id)) continue;
        if (posFit(p, s) < 0.5) continue;
        const r = evalPair(xiWith(curXi, s, p), curC);
        if (!best || r.win > best.r.win) best = {type:"p", s, p, r};
      }
    }
    if (!coachDone){
      for (const c of cpool){
        if (c.id === curC.id) continue;
        const r = evalPair(curXi, c);
        if (!best || r.win > best.r.win) best = {type:"c", c, r};
      }
    }
    if (!best || best.r.win <= curWin + 0.0015) break;
    if (best.type === "p"){
      steps.push({type:"p", slot:best.s, out:curXi[best.s], in:best.p,
                  win:best.r.win, gain:best.r.win - curWin});
      curXi = xiWith(curXi, best.s, best.p);
      usedIds.add(best.p.id); usedSlots.add(best.s);
    } else {
      steps.push({type:"c", out:curC, in:best.c, win:best.r.win, gain:best.r.win - curWin});
      curC = best.c; coachDone = true;
    }
    curWin = best.r.win;
  }
  return {steps, xi:curXi, coach:curC, baseL:base.L, afterL:evalPair(curXi, curC).L,
          baseWin:base.win, afterWin:curWin};
}

/* ---------------------------------------------------------------- 重算 */
function play(){
  const mi = state.mi, m = MATCHES[mi];
  const L = currentL(state, mi);
  const seed = seedFor(mi, state.side, L[0], L[1], state.coach ? state.coach.id : "");
  const r = settle(seed, L[0], L[1]);
  const rng = r.rng;

  const xiH = state.side === 0 ? state.xi : DEFAULT_XI[m[2]];
  const xiA = state.side === 1 ? state.xi : DEFAULT_XI[m[3]];

  const seq = [];
  for (let i=0;i<r.x;i++) seq.push(0);
  for (let i=0;i<r.y;i++) seq.push(1);
  for (let i=seq.length-1;i>0;i--){ const j = Math.floor(rng()*(i+1)); [seq[i],seq[j]]=[seq[j],seq[i]]; }
  const times = seq.map(()=>1+Math.floor(rng()*90)).sort((a,b)=>a-b);

  const pickW = (pool, w) => {
    const tot = w.reduce((a,b)=>a+b,0);
    let u = rng()*tot;
    for (let i=0;i<pool.length;i++){ u -= w[i]; if (u <= 0) return pool[i]; }
    return pool[pool.length-1];
  };
  const scorerOf = (xiArr) => {
    const pool = xiArr.filter(Boolean);
    if (!pool.length) return null;
    return pickW(pool, pool.map(p => Math.max(0.02,
      (p.att + 1.15) * (p.slot >= 8 ? 2.4 : (p.slot >= 5 ? 1.1 : 0.30)))));
  };
  // 约三分之二的进球有助攻，助攻者按视野(vis)加权，排除进球者本人
  const assisterOf = (xiArr, scorer) => {
    if (rng() < 0.34) return null;
    const pool = xiArr.filter(p => p && (!scorer || p.id !== scorer.id));
    if (!pool.length) return null;
    return pickW(pool, pool.map(p => Math.max(0.05, (p.a[6] + 8) * (p.slot >= 5 ? 1.7 : 0.5))));
  };

  const evs = seq.map((sd, i) => {
    const xiArr = sd === 0 ? xiH : xiA;
    const p = scorerOf(xiArr);
    return { mn: times[i], ci: sd === 0 ? m[2] : m[3], p, sd, assist: assisterOf(xiArr, p) };
  }).sort((a,b) => a.mn - b.mn);

  state.result = {x:r.x, y:r.y, L, seed, evs, hg:m[4], ag:m[5]};
  go("result");
}

/* ---------------------------------------------------------------- 事件 */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-r],[data-mi],[data-back],[data-edit],[data-slot],[data-coach],[data-reco],[data-play],[data-again],[data-share]");
  if (!t) return;

  if (t.dataset.r != null){ state.round = +t.dataset.r; render(); return; }
  if (t.dataset.mi != null){ go("detail", {mi:+t.dataset.mi}); return; }

  if (t.hasAttribute("data-back")){
    if (state.screen === "detail") go("home");
    else if (state.screen === "edit") go("detail");
    else if (state.screen === "result") go("edit");
    return;
  }
  if (t.hasAttribute("data-edit")){
    const m = MATCHES[state.mi];
    const side = m[2] === FAV ? 0 : (m[3] === FAV ? 1 : 1);
    const clubIdx = side === 0 ? m[2] : m[3];
    go("edit", {
      side, xi: DEFAULT_XI[clubIdx].slice(),
      coach: DEFAULT_COACH[CLUBS[clubIdx].f],
      swaps: [], coachSwap: null, result: null,
    });
    return;
  }
  if (t.dataset.slot != null){ openPicker(+t.dataset.slot); return; }
  if (t.hasAttribute("data-coach")){ openCoachPicker(); return; }
  if (t.hasAttribute("data-reco")){ openReco(); return; }
  if (t.hasAttribute("data-play")){
    if (usedQuota() === 0){ toast("先换个人或换个帅"); return; }
    play(); return;
  }
  if (t.hasAttribute("data-again")){ go("edit"); return; }
  if (t.hasAttribute("data-share")){ shareCard(); return; }
});
$("btnInfo").onclick = infoModal;
document.addEventListener("keydown", e => { if (e.key === "Escape"){ closeSheet(); closeModal(); } });

/* 启动 */
(function boot(){
  const vt = document.getElementById("verTag");
  vt.textContent = "v" + BUILD.version + (DEV ? " DEV" : "");
  if (DEV) vt.classList.add("dev");

  const h = new URLSearchParams(location.hash.slice(1));
  if (!h.has("m")){ render(); return; }
  const mi = +h.get("m");
  if (!(mi >= 0 && mi < MATCHES.length)){ render(); return; }
  state.mi = mi;
  const m = MATCHES[mi];
  const side = m[2] === FAV ? 0 : (m[3] === FAV ? 1 : 1);
  const clubIdx = side === 0 ? m[2] : m[3];
  if (h.has("edit")){
    Object.assign(state, {
      side, xi: DEFAULT_XI[clubIdx].slice(),
      coach: DEFAULT_COACH[CLUBS[clubIdx].f], swaps: [], coachSwap: null,
    });
    if (h.has("pay")){ state.unlocked = true; state.quota = PAID_QUOTA; }
    if (h.has("reco")){
      render(); go("edit");
      setTimeout(() => (state.unlocked ? openReco() : openReco()), 60);
      return;
    }
    if (h.has("play")){ render(); play(); return; }
    go("edit");
    return;
  }
  render(); go("detail");
})();
</script>
</body>
