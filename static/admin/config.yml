backend:
  name: git-gateway
  repo: datazhanbo/zanbo-growth-lab
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

# 媒体库配置
media_folder: "static/images/uploads"
public_folder: "/images/uploads"

# 站点配置
site_url: https://zanbo-growth-lab.netlify.app/
display_url: https://zanbo-growth-lab.netlify.app/
logo_url: https://zanbo-growth-lab.netlify.app/images/logo.png

# 集合配置
collections:
  # 博客文章
  - name: "posts"
    label: "博客文章"
    label_singular: "文章"
    description: "管理博客文章"
    folder: "content/posts"
    path: "{{slug}}"
    create: true
    delete: true
    editor:
      preview: true
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: "HH:mm", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "描述", name: "description", widget: "string", required: false }
      - { label: "标签", name: "tags", widget: "list", summary: "{{fields.tag}}", field: { label: "标签", name: "tag", widget: "string" }, required: false }
      - { label: "分类", name: "categories", widget: "list", summary: "{{fields.category}}", field: { label: "分类", name: "category", widget: "string" }, required: false }
      - { label: "草稿", name: "draft", widget: "boolean", default: true }
      - { label: "显示目录", name: "showToc", widget: "boolean", default: true, required: false }
      - { label: "默认展开目录", name: "TocOpen", widget: "boolean", default: false, required: false }
      - { label: "启用评论", name: "comments", widget: "boolean", default: true, required: false }
      - { label: "显示阅读时间", name: "ShowReadingTime", widget: "boolean", default: true, required: false }
      - label: "封面图片"
        name: "cover"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "图片", name: "image", widget: "image", required: false }
          - { label: "替代文本", name: "alt", widget: "string", required: false }
          - { label: "图片说明", name: "caption", widget: "string", required: false }
          - { label: "隐藏封面", name: "hidden", widget: "boolean", default: false, required: false }
      - { label: "正文内容", name: "body", widget: "markdown" }

  # 独立页面
  - name: "pages"
    label: "独立页面"
    label_singular: "页面"
    description: "管理独立页面（如关于页）"
    folder: "content"
    create: true
    delete: true
    editor:
      preview: true
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime", required: false }
      - { label: "描述", name: "description", widget: "string", required: false }
      - { label: "草稿", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "正文内容", name: "body", widget: "markdown" }

  # 首页配置
  - name: "home"
    label: "首页设置"
    description: "配置首页显示内容"
    files:
      - name: "index"
        label: "首页"
        file: "content/_index.md"
        fields:
          - { label: "标题", name: "title", widget: "string" }
          - { label: "内容", name: "body", widget: "markdown" }
